services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: superforecaster
      POSTGRES_USER: sf
      POSTGRES_PASSWORD: sf
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sf", "-d", "superforecaster"]
      interval: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    environment:
      APP_MODE: api
      DATABASE_URL: postgresql+asyncpg://sf:sf@db:5432/superforecaster
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    env_file: .env
    environment:
      APP_MODE: worker
      DATABASE_URL: postgresql+asyncpg://sf:sf@db:5432/superforecaster
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
